<!DOCTYPE html>
<html>
<head>
    <title>Login | Cloud Code Editor</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #0f172a, #2563eb, #7c3aed);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 360px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            text-align: center;
        }

        .logo {
            font-size: 32px;
            margin-bottom: 8px;
        }

        h2 {
            margin-bottom: 5px;
            color: #111827;
        }

        p {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            color: red;
            font-size: 14px;
            margin-top: 10px;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <div class="logo">☁️</div>
        <h2>Cloud Code Editor</h2>
        <p>Login to start coding and collaborating online</p>

        <form method="POST">
            <input type="text" name="username" placeholder="Enter username" required>
            <input type="password" name="password" placeholder="Enter password" required>

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <button type="submit">Login</button>
        </form>

        <div class="footer">
            Demo login: aryan / 1234
        </div>
    </div>

</body>
</html>
