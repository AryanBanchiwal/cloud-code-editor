<!DOCTYPE html>
<html>
<head>
    <title>Cloud Editor</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <style>
        body { font-family: Arial; margin:0; background:#111; color:white; }
        .top { background:blue; padding:10px; display:flex; gap:10px; }
        textarea { width:100%; height:300px; background:black; color:lime; }
        #output { background:black; padding:10px; height:150px; overflow:auto; }
        #preview { height:150px; width:100%; border:none; }
    </style>
</head>

<body>

<div class="top">
    <b>Cloud Editor</b>

    <input id="user" value="{{username}}" readonly>
    <input id="room" placeholder="Room ID">

    <select id="lang">
        <option value="python">Python</option>
        <option value="javascript">JavaScript</option>
        <option value="html">HTML</option>
        <option value="css">CSS</option>
    </select>

    <button onclick="joinRoom()">Join Room</button>
    <button onclick="runCode()">Run Code</button>

    <a href="/logout"><button>Logout</button></a>
</div>

<textarea id="code">print("Hello World")</textarea>

<h3>Output:</h3>
<div id="output"></div>
<iframe id="preview"></iframe>

<h3>Chat:</h3>
<div id="chatBox"></div>

<input id="msg">
<button onclick="sendMsg()">Send</button>

<script>

const socket = io();

let room = "";

function joinRoom() {
    room = document.getElementById("room").value;

    if(room === ""){
        alert("Enter room");
        return;
    }

    socket.emit("join_room", {
        room: room,
        username: document.getElementById("user").value
    });

    alert("Joined room");
}

socket.on("load_code", (data)=>{
    document.getElementById("code").value = data.code;
});

socket.on("update", (data)=>{
    document.getElementById("code").value = data.code;
});

document.getElementById("code").addEventListener("input", ()=>{
    if(room !== ""){
        socket.emit("code", {
            room: room,
            code: document.getElementById("code").value
        });
    }
});

socket.on("chat", (data)=>{
    let box = document.getElementById("chatBox");
    box.innerHTML += "<p><b>"+data.user+":</b> "+data.msg+"</p>";
});

function sendMsg(){
    socket.emit("chat", {
        room: room,
        user: document.getElementById("user").value,
        msg: document.getElementById("msg").value
    });

    document.getElementById("msg").value="";
}

function runCode(){
    let code = document.getElementById("code").value;
    let lang = document.getElementById("lang").value;

    let out = document.getElementById("output");
    let preview = document.getElementById("preview");

    out.innerText="";
    preview.srcdoc="";

    // HTML
    if(lang === "html"){
        preview.srcdoc = code;
        return;
    }

    // CSS
    if(lang === "css"){
        preview.srcdoc = "<style>"+code+"</style><h1>Preview</h1>";
        return;
    }

    // JavaScript (REAL)
    if(lang === "javascript"){
        try{
            let result = eval(code);
            out.innerText = result || "Executed";
        }catch(e){
            out.innerText = e;
        }
        return;
    }

    // Python (simple simulation)
    if(lang === "python"){
        let lines = code.split("\n");
        let result = "";

        lines.forEach(l=>{
            if(l.includes("print")){
                let t = l.substring(l.indexOf("(")+1, l.lastIndexOf(")"));
                result += t.replace(/['"]/g,"") + "\n";
            }
        });

        out.innerText = result || "Python output";
    }
}

</script>

</body>
</html>
