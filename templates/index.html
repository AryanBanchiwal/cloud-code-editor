<!DOCTYPE html>
<html>
<head>
    <title>Cloud Code Editor</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1e1e2f;
            color: white;
        }

        .navbar {
            background: #0d6efd;
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input, select {
            padding: 8px;
            border-radius: 5px;
            border: none;
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .run-btn { background: #198754; color: white; }
        .join-btn { background: #0dcaf0; }
        .logout-btn { background: red; color: white; }

        textarea {
            width: 100%;
            height: 350px;
            background: #0d1117;
            color: #00ff9f;
            font-size: 16px;
            padding: 10px;
            border: none;
        }

        #output {
            background: black;
            color: lime;
            height: 200px;
            padding: 10px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        iframe {
            width: 100%;
            height: 200px;
            border: none;
        }
    </style>
</head>

<body>

<div class="navbar">
    <b>☁ Cloud Code Editor</b>

    <input id="username" value="{{username}}" readonly>

    <input id="room" placeholder="Room ID">

    <select id="language">
        <option value="python">Python</option>
        <option value="javascript">JavaScript</option>
        <option value="java">Java</option>
        <option value="cpp">C++</option>
        <option value="html">HTML</option>
        <option value="css">CSS</option>
    </select>

    <button class="join-btn" onclick="joinRoom()">Join Room</button>
    <button class="run-btn" onclick="runCode()">Run Code</button>

    <a href="/logout">
        <button class="logout-btn">Logout</button>
    </a>
</div>

<textarea id="code">
// Write your code here
print("Hello Cloud Editor 🚀")
</textarea>

<h3 style="padding-left:10px;">Output:</h3>

<div id="output"></div>
<iframe id="preview"></iframe>

<script>
    const socket = io();

    function joinRoom() {
        const room = document.getElementById("room").value;
        const username = document.getElementById("username").value;

        socket.emit("join_room", {
            room_id: room,
            username: username
        });
    }

    socket.on("load_code", (data) => {
        document.getElementById("code").value = data.code;
    });

    socket.on("code_update", (data) => {
        document.getElementById("code").value = data.code;
    });

    document.getElementById("code").addEventListener("input", () => {
        const room = document.getElementById("room").value;

        socket.emit("code_change", {
            room_id: room,
            code: document.getElementById("code").value
        });
    });

    async function runCode() {
        const code = document.getElementById("code").value;
        const language = document.getElementById("language").value;

        document.getElementById("output").innerText = "Running...";
        document.getElementById("preview").srcdoc = "";

        try {
            const res = await fetch("/run", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({code, language})
            });

            const data = await res.json();

            if (data.type === "html") {
                document.getElementById("preview").srcdoc = data.output;
                document.getElementById("output").innerText = "Rendered in preview below 👇";
            } else {
                document.getElementById("output").innerText = data.output;
            }

        } catch (err) {
            document.getElementById("output").innerText = "Error running code";
        }
    }
</script>

</body>
</html>
