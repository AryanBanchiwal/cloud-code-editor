<!DOCTYPE html>
<html>
<head>
    <title>Cloud Code Editor</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.33.0/min/vs/loader.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #111827;
            color: white;
        }

        .topbar {
            height: 55px;
            background: #020617;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 15px;
        }

        input, select {
            padding: 8px;
            border-radius: 6px;
            border: none;
        }

        button {
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .logout {
            margin-left: auto;
            background: red;
        }

        #editor {
            height: 70vh;
        }

        #outputBox {
            height: 20vh;
            background: black;
            color: #00ff00;
            padding: 10px;
            overflow-y: auto;
        }
    </style>
</head>

<body>

<div class="topbar">
    <b>☁ Cloud Code Editor</b>

    <input id="username" value="{{ username }}" readonly>
    <input id="room" placeholder="Room ID">

    <select id="language">
        <option value="python">Python</option>
        <option value="javascript">JavaScript</option>
        <option value="java">Java</option>
        <option value="cpp">C++</option>
        <option value="html">HTML</option>
    </select>

    <button onclick="joinRoom()">Join Room</button>
    <button onclick="runCode()">Run Code</button>

    <a href="/logout">
        <button class="logout">Logout</button>
    </a>
</div>

<div id="editor"></div>
<pre id="outputBox">Output will appear here...</pre>

<script>
const socket = io();

let username = document.getElementById("username").value;
let room = "";
let editor;
let ignore = false;

require.config({
    paths: {
        vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.33.0/min/vs"
    }
});

require(["vs/editor/editor.main"], function () {
    editor = monaco.editor.create(document.getElementById("editor"), {
        value: "print('Hello Cloud')",
        language: "python",
        theme: "vs-dark"
    });

    editor.onDidChangeModelContent(() => {
        if (ignore || room === "") return;

        socket.emit("code_change", {
            room_id: room,
            code: editor.getValue()
        });
    });
});

function joinRoom() {
    room = document.getElementById("room").value;

    socket.emit("join_room", {
        username: username,
        room_id: room
    });

    alert("Joined room: " + room);
}

socket.on("load_code", function(data) {
    ignore = true;
    editor.setValue(data.code);
    ignore = false;
});

socket.on("code_update", function(data) {
    ignore = true;
    editor.setValue(data.code);
    ignore = false;
});


/* 🔥 FIXED RUN CODE FUNCTION */
async function runCode() {
    const code = editor.getValue();
    const lang = document.getElementById("language").value;
    const outputBox = document.getElementById("outputBox");

    outputBox.innerText = "Running code...";

    const languageMap = {
        python: { language: "python", version: "3.10.0" },
        javascript: { language: "javascript", version: "18.15.0" },
        java: { language: "java", version: "15.0.2" },
        cpp: { language: "cpp", version: "10.2.0" }
    };

    if (lang === "html") {
        outputBox.innerText = code;
        return;
    }

    try {
        const selected = languageMap[lang];

        const response = await fetch("https://emkc.org/api/v2/piston/execute", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                language: selected.language,
                version: selected.version,
                files: [
                    {
                        content: code
                    }
                ]
            })
        });

        const data = await response.json();
        console.log(data);

        if (data.run && data.run.output) {
            outputBox.innerText = data.run.output;
        } else if (data.run && data.run.stderr) {
            outputBox.innerText = data.run.stderr;
        } else {
            outputBox.innerText = "No output.";
        }

    } catch (error) {
        console.error(error);
        outputBox.innerText = "Server connection error.";
    }
}
</script>

</body>
</html>
